<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PraanSeva - Care Today. Healthier Tomorrows.</title>
  <meta name="description" content="PraanSeva: AI-powered healthcare access for rural communities. Care today, healthier tomorrows." />
  <link rel="icon" type="image/jpeg" href="/praanseva-logo.jpg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    /* Custom scrollbar for chat windows */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.8);
        opacity: 0.5;
      }

      100% {
        transform: scale(2);
        opacity: 0;
      }
    }

    .animate-pulse-ring {
      animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    /* Ensure map doesn't break layout */
    .leaflet-container {
      width: 100%;
      height: 100%;
      background: #f1f5f9;
    }

    /* Polyfill for tailwindcss-animate usage via CDN */
    .animate-in {
      animation-duration: 150ms;
      --tw-enter-opacity: initial;
      --tw-enter-scale: initial;
      --tw-enter-translate-x: initial;
      --tw-enter-translate-y: initial;
      animation-name: enter;
      animation-fill-mode: both;
    }

    .fade-in {
      --tw-enter-opacity: 0;
    }

    .zoom-in-95 {
      --tw-enter-scale: 0.95;
    }

    .slide-in-from-bottom-8 {
      --tw-enter-translate-y: 2rem;
    }

    .slide-in-from-top-4 {
      --tw-enter-translate-y: -1rem;
    }

    .slide-in-from-right-4 {
      --tw-enter-translate-x: 1rem;
    }

    .slide-in-from-right {
      --tw-enter-translate-x: 100%;
    }

    .slide-in-from-top-2 {
      --tw-enter-translate-y: -0.5rem;
    }

    .duration-200 {
      animation-duration: 200ms;
    }

    .duration-300 {
      animation-duration: 300ms;
    }

    .duration-500 {
      animation-duration: 500ms;
    }

    .duration-700 {
      animation-duration: 700ms;
    }

    @keyframes enter {
      0% {
        opacity: var(--tw-enter-opacity, 1);
        transform: translate3d(var(--tw-enter-translate-x, 0), var(--tw-enter-translate-y, 0), 0) scale3d(var(--tw-enter-scale, 1), var(--tw-enter-scale, 1), var(--tw-enter-scale, 1));
      }
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
